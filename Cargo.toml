[package]
name = "omeasure"
version = "0.1.0"
edition = "2021"
description = "A PixelSnap-style measuring ruler and color picker overlay for Omarchy/Hyprland"
license = "MIT"

[[bin]]
name = "omeasure"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", package = "gtk4", features = ["v4_8"] }
gtk4-layer-shell = "0.5"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
